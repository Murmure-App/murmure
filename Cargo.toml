[package]
name = "murmure"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Peer-to-peer terminal messaging over Tor onion services"

[dependencies]
# Arti is pinned with "=" on purpose: 0.x crates, monthly releases, API breaks
# at every bump. See aidd_docs/INSTALL.md.
#
# onion-service-service  -> publish a v3 onion service (implies `keymgr`)
# onion-service-client   -> dial a .onion address
# experimental-api       -> TorClient::launch_onion_service_with_hsid (route A)
#   and the service-discovery key API used by restricted discovery
# restricted-discovery   -> publish a descriptor whose introduction points are
#   encrypted for a named set of clients. Without it the .onion address is a
#   bearer token: anyone who ever saw it can confirm the service is up. With it,
#   an unauthorized client cannot even decrypt the descriptor, so the service is
#   invisible rather than merely closed. Upstream files this under DoS
#   resistance and says so explicitly — it is not a substitute for access
#   control, and revoking a client is not immediate (the introduction points are
#   not rotated). murmure takes it for the confidentiality, not the DoS.
# static-sqlite          -> compile SQLite from source instead of linking a
#   system one. tor-dirmgr caches the Tor consensus in SQLite, and without this
#   the link step fails on Windows (`LNK1181: cannot open sqlite3.lib`, there is
#   no system SQLite) and on a fresh Linux without `libsqlite3-dev`. Costs a
#   minute of C compilation and buys one build recipe on all three platforms.
#
# default-features is off to drop `native-tls`, which is nonadditive with
# `rustls`. The three features that come back are the rest of arti's default set
# (`tokio`, `compression`, `flowctl-cc`) — dropping those would change behaviour
# for no reason.
#
# rustls rather than native-tls, for two reasons:
#
#  1. native-tls is schannel on Windows, Security.framework on macOS, OpenSSL on
#     Linux. So the TLS ClientHello announces the operating system. For a tool
#     whose entire purpose is that nobody learns who talks to whom, having the
#     transport layer volunteer what you run is against the grain. rustls makes
#     every murmure look alike.
#  2. It is also the leading suspect for a Windows bootstrap that stalls with
#     the channel handshake complete and the circuit's CREATE2 never answered.
#     Unconfirmed — see the field notes in aidd_docs/INSTALL.md.
arti-client = { version = "=0.44.0", default-features = false, features = [
    "tokio",
    "compression",
    "flowctl-cc",
    "rustls",
    "experimental-api",
    "onion-service-client",
    "onion-service-service",
    "restricted-discovery",
    "static-sqlite",
] }

# Named directly so murmure can build the onion-service config, the nickname,
# and its own HsIdKeypair instead of letting arti generate one.
tor-hsservice = "=0.44.0"
tor-hscrypto = "=0.44.0"
tor-llcrypto = "=0.44.0"
tor-keymgr = "=0.44.0"
# CONNECTED / END relay messages, needed to answer a StreamRequest.
tor-cell = "=0.44.0"
# PreferredRuntime, to name the concrete TorClient type. arti-client does not
# re-export it.
tor-rtcompat = { version = "=0.44.0", features = ["tokio", "rustls"] }
# Not used in murmure's own code: named only to pick rustls' crypto provider.
# arti pulls rustls in with default features off and selects neither backend, so
# `CryptoProvider::install_default` would otherwise have to be called by hand —
# and rustls panics on the first connection if nobody does. Cargo unifies
# features per crate, so enabling `ring` here settles it for arti's copy too.
#
# `ring` rather than `aws-lc-rs`: ring ships pre-generated assembly, while
# aws-lc-rs wants cmake and NASM installed on Windows. One less thing to make a
# newcomer install before they can say hello.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# HsId is inherently sensitive: printing it unredacted goes through
# safelog::DisplayRedacted.
safelog = "0.9"

# Base64 for the OSC 52 clipboard escape. Named rather than hand-rolled, and it
# costs nothing: arti already compiles it, so this adds no build time and no new
# code to the tree. The alternative to OSC 52 is a clipboard crate, which on
# Linux wants X11 or Wayland libraries at build time and would break the one
# build recipe that works on all three platforms.
data-encoding = "2"

# The v2 data plane: a direct QUIC link for file transfer, used only when the
# operator asks for it by name (`/send --direct`). Tor stays the default and
# carries everything else — see aidd_docs/INSTALL.md.
#
# `ring` rather than `aws-lc-rs` on both of these, for the same reason as
# rustls above: aws-lc-rs wants cmake and NASM on Windows. Both resolve against
# the rustls 0.23 arti already pulls, so there is no second TLS stack.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
# A self-signed certificate per connection. There is no CA and there is nothing
# for one to attest: the peer is authenticated by a fingerprint handed over the
# already-authenticated Tor channel, so the certificate is only a carrier for a
# public key.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
# `zeroize` is not on by default: the cipher keeps the expanded key in its own
# state, and without this that state is left in freed memory on drop. Costs
# nothing — zeroize is already in the tree below.
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
blake3 = "1.8.5"

# Wipe key material on drop rather than leaving it in freed memory, where a core
# dump or a swapped-out page can outlive the process. Not a defence against a
# live attacker who can already read our memory — it shortens the window, which
# is all any userspace program can do.
#
# Free, in both senses: arti already compiles zeroize, and `Zeroizing<T>` is a
# wrapper with a Drop impl, so no derive macro and no `derive` feature. The
# fields that hold key material change type; nothing else in the tree moves.
zeroize = "1"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

[dev-dependencies]
tokio-util = { version = "0.7.19", features = ["compat"] }

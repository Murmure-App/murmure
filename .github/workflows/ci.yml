# Compile and test murmure on every push, on the platforms it claims to support.
#
# Before this existed, the only thing that ever built murmure in a clean
# environment was the release workflow — which runs after a tag is pushed, when
# finding out is least useful.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published against code that has not changed. Weekly, so a
  # dependency that becomes dangerous on a quiet week is still noticed.
  schedule:
    - cron: "0 6 * * 1"

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Pinned to a commit rather than a tag: a tag is a movable pointer, and
      # whoever controls it controls what runs here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # arti is around ten minutes of compilation from cold, which is long
      # enough that an uncached CI is one nobody waits for. The key is the
      # lockfile: dependencies only rebuild when they actually change.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # No `cargo fmt --check`. Running it on this tree rewrites 450 lines
      # across every file — rustfmt breaks method chains over 60 characters,
      # and a good deal of this code reads better on one line than on four.
      # Enforcing it would buy consistency nobody asked for at the price of a
      # commit that makes `git blame` useless everywhere. Add it the day a
      # second person writes code here.
      #
      # Lints on every platform: clippy reads the source as the target sees
      # it, and `cfg(unix)` / `cfg(windows)` blocks are only read where they
      # compile.
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      # `--locked` so a dependency that resolves differently here than on the
      # author's machine fails loudly instead of being silently tested.
      #
      # The ignored test dials the real Tor network. It belongs to a person
      # debugging a bootstrap, not to CI, where it would fail on the network
      # rather than on the code.
      - name: Tests
        run: cargo test --locked

  # The oldest compiler `rust-version` promises. `check` rather than `test`:
  # what can break is an API newer than 1.92, and that fails to compile.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-cargo-
      # rustup is on the runner already; the version comes from Cargo.toml so
      # the two cannot disagree.
      - name: Check with the minimum Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --all-targets --locked

  # Known vulnerabilities in the dependency tree. Its own job, on its own
  # schedule as well as on push: an advisory is published against code that has
  # not changed, so a check that only runs when somebody commits is a check that
  # finds it late.
  audit:
    runs-on: ubuntu-latest
    # Narrower than the default token, and wider than the workflow's own
    # read-only default: the scheduled run has to be able to open an issue, or a
    # advisory published on a quiet week is found by nobody.
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 — a timing sidechannel in RSA private-key
          # operations, reached through `ssh-key-fork-arti`, which arti uses to
          # read and write its keystore. There is no fixed version, and murmure
          # performs no RSA operation of any kind: every key here is ed25519 or
          # x25519. Ignored with a name and a reason rather than silently, so
          # that the day arti drops it this line is what says so.
          #
          # RUSTSEC-2024-0436 — `paste` is unmaintained. A proc-macro reached
          # through arti (`pwd-grp` -> `fs-mistrust`): nothing of it runs at
          # runtime, there is no fixed version, and it goes when arti drops it.
          #
          # RUSTSEC-2025-0141 — `bincode` is unmaintained. It sits in
          # Cargo.lock as an optional dependency of `typed-index-collections`
          # (via `tor-netdir`), but that feature is off, so it is never
          # compiled: `cargo tree -i bincode` prints nothing. cargo-audit reads
          # the lockfile, hence the report.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2024-0436,RUSTSEC-2025-0141
